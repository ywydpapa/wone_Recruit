{% extends "base.html" %}
{% block title %}인재 검색 - 본인 확인{% endblock %}

{% block content %}
<div class="page-header"><h2>본인 확인</h2></div>

<div class="content-card talents-auth-card">
    <div class="text-center mb-4">
        <i class="fas fa-lock fa-2x text-muted"></i>
        <p class="text-muted small mt-3">
            구직자의 개인정보 보호를 위해<br>비밀번호를 다시 입력해 주세요.
        </p>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        {% if error == 'wrong' %}비밀번호가 일치하지 않습니다.{% endif %}
    </div>
    {% endif %}

    <form method="post" action="/company/talents/auth">
        {{ csrf_input }}
        {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password"
                   required autofocus autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">확인</button>
    </form>
</div>
{% endblock %}
