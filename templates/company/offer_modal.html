<div class="modal fade" id="offerModal" tabindex="-1" aria-labelledby="offerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" action="" id="offerForm" data-company="{{ company_name }}">
                {{ csrf_input }}
                {% if offer_next %}<input type="hidden" name="next" value="{{ offer_next }}">{% endif %}
                <div class="modal-header">
                    <h5 class="modal-title" id="offerModalLabel">채용 제안하기</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    {% if offer_tpls %}
                    <div class="mb-3">
                        <label for="offerTpl" class="form-label fw-bold">양식 불러오기</label>
                        <select class="form-select" id="offerTpl">
                            <option value="">직접 작성</option>
                            {% for t in offer_tpls %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="offerTitle" class="form-label fw-bold">제목 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="offerTitle" name="title" required placeholder="예: [{{ company_name }}] 채용 제안드립니다">
                    </div>
                    <div class="mb-3">
                        <label for="offerMessage" class="form-label fw-bold">제안 내용 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="offerMessage" name="message" rows="5" required placeholder="회사 소개, 포지션, 조건 등을 자유롭게 작성해 주세요."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="offerContact" class="form-label fw-bold">연락처</label>
                        <input type="text" class="form-control" id="offerContact" name="contact" placeholder="이메일 또는 전화번호">
                    </div>
                    <details class="offer-tpl-save">
                        <summary>지금 내용을 양식으로 저장</summary>
                        <div class="input-group input-group-sm mt-2">
                            <input type="text" class="form-control" id="offerTplName" maxlength="50" placeholder="양식 이름" aria-label="양식 이름">
                            <button type="button" class="btn btn-outline-secondary" id="offerTplSave">저장</button>
                        </div>
                        <p class="offer-tpl-msg" id="offerTplMsg" role="status"></p>
                    </details>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-5">제안 보내기</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script type="application/json" id="offerTplData">{{ offer_tpls|tojson }}</script>
<script src="/static/js/offer-modal.js?v=1"></script>
