<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - WONE Recruit</title>
    <script>
    (function(){var t=localStorage.getItem('recruit_theme');
    if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --text: #222;
            --text-muted: #999;
            --border: #e5e5e5;
            --bg: #f7f8fa;
        }
        body {
            font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            color: var(--text);
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }
        .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .login-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 40px 36px;
            border: 1px solid var(--border);
        }
        .brand-logo {
            font-weight: 700; font-size: 2rem; color: var(--text);
            text-align: center; text-decoration: none; display: block; margin-bottom: 4px;
        }
        .brand-logo span { color: var(--primary); }
        .login-title {
            text-align: center; color: var(--text-muted); font-weight: 500;
            font-size: 0.95rem; margin-bottom: 32px;
        }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: #bbb; font-size: 1rem;
        }
        .form-control-lg {
            border-radius: 4px; font-size: 0.95rem;
            padding: 12px 16px 12px 40px;
            background-color: var(--bg);
            border: 1px solid var(--border);
        }
        .form-control-lg:focus {
            box-shadow: none;
            border-color: var(--primary);
            background-color: #fff;
        }
        .form-select-lg {
            border-radius: 4px; font-size: 0.95rem;
            padding: 12px 16px;
            background-color: var(--bg);
            border: 1px solid var(--border);
        }
        .btn-primary-custom {
            background-color: var(--primary); color: white;
            border-radius: 6px; padding: 12px; font-weight: 600;
            font-size: 1rem; width: 100%; border: none;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover); color: white;
        }
        .link-custom {
            color: var(--primary); text-decoration: none; font-weight: 600;
        }
        .link-custom:hover { color: var(--primary-hover); text-decoration: underline; }
        .back-to-home {
            display: block; text-align: center; margin-top: 16px;
            color: var(--text-muted); text-decoration: none; font-size: 0.88rem;
        }
        .back-to-home:hover { color: var(--text); }
        .agree-box {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            background: #fafbfc;
            margin-bottom: 20px;
        }
        .agree-all-row {
            display: flex;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .agree-all-row label {
            font-weight: 700;
            font-size: 0.97rem;
            cursor: pointer;
            margin-left: 8px;
        }
        .agree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .agree-item:last-child { margin-bottom: 0; }
        .agree-item label {
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            margin-left: 8px;
        }
        .agree-item .view-link {
            font-size: 0.82rem;
            color: var(--primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .agree-item .view-link:hover { text-decoration: underline; }
        .form-check-input { cursor: pointer; }

        [data-theme="dark"] {
            --text: #D1D5DB; --text-muted: #6B7280; --border: #2D333B; --bg: #161B22;
            --primary: #4a9eff; --primary-hover: #3a8ae6;
            color-scheme: dark;
        }
        [data-theme="dark"] .login-card { background: #1C2128; }
        [data-theme="dark"] .form-control-lg,
        [data-theme="dark"] .form-select-lg { background-color: var(--bg); color: var(--text); }
        [data-theme="dark"] .form-control-lg:focus { background-color: #1C2128; }
        [data-theme="dark"] .input-icon-wrapper i { color: var(--text-muted); }
        [data-theme="dark"] .agree-box { background: #1a1f27; }
        [data-theme="dark"] .agree-item label { color: var(--text-secondary); }
        [data-theme="dark"] .form-check-input { background-color: var(--bg); border-color: var(--border); }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>WONE</span> Recruit</a>
        <div class="login-title">새 계정 만들기</div>

        {% if error == 'dup' %}
        <div class="alert alert-danger py-2 small mb-3">이미 사용 중인 아이디입니다. 다른 아이디를 사용해 주세요.</div>
        {% elif error == 'agree_required' %}
        <div class="alert alert-danger py-2 small mb-3">이용약관과 개인정보 수집 및 이용에 동의해 주세요.</div>
        {% endif %}

        <form action="/signup" method="post">
            {{ csrf_input }}
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="name" class="form-control form-control-lg" placeholder="이름" required>
                <i class="fas fa-id-card"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="phone" class="form-control form-control-lg" placeholder="전화번호">
                <i class="fas fa-phone"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="email" name="email" class="form-control form-control-lg" placeholder="이메일 (선택사항)">
                <i class="fas fa-envelope"></i>
            </div>
            <div class="mb-4">
                <div class="d-flex gap-4 justify-content-center py-2">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role_seeker" value="seeker" checked>
                        <label class="form-check-label fw-600" for="role_seeker">구직자(장애인)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role_company" value="company">
                        <label class="form-check-label fw-600" for="role_company">기업</label>
                    </div>
                </div>
            </div>
            <div class="agree-box">
                <div class="agree-all-row">
                    <input class="form-check-input" type="checkbox" id="agree_all">
                    <label for="agree_all">전체 동의</label>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_terms" id="agree_terms" value="1">
                        <label for="agree_terms">[필수] 이용약관 동의</label>
                    </div>
                    <a href="/terms" target="_blank" class="view-link">보기</a>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_privacy" id="agree_privacy" value="1">
                        <label for="agree_privacy">[필수] 개인정보 수집 및 이용 동의</label>
                    </div>
                    <a href="/privacy" target="_blank" class="view-link">보기</a>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_marketing" id="agree_marketing" value="1">
                        <label for="agree_marketing">[선택] 마케팅 정보 수신 동의</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-custom">가입하기</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted fs-095">이미 계정이 있으신가요?</span>
            <a href="/login" class="link-custom ms-1">로그인</a>
        </div>
    </div>
    <a href="/login" class="back-to-home"><i class="fas fa-arrow-left me-1"></i> 로그인으로 돌아가기</a>
</div>
<script>
    const agreeAll = document.getElementById('agree_all');
    const agreeTerms = document.getElementById('agree_terms');
    const agreePrivacy = document.getElementById('agree_privacy');
    const agreeMarketing = document.getElementById('agree_marketing');
    const required = [agreeTerms, agreePrivacy];
    const all = [agreeTerms, agreePrivacy, agreeMarketing];

    agreeAll.addEventListener('change', () => {
        all.forEach(c => c.checked = agreeAll.checked);
    });

    all.forEach(c => c.addEventListener('change', () => {
        agreeAll.checked = all.every(x => x.checked);
    }));

    document.querySelector('form').addEventListener('submit', e => {
        if (!agreeTerms.checked || !agreePrivacy.checked) {
            e.preventDefault();
            alert('이용약관과 개인정보 수집 및 이용에 동의해 주세요.');
        }
    });
</script>
</body>
</html>
