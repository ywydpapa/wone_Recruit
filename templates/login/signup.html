<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - WONE Recruit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #eef4fb;
            --dark-blue: #0a2540;
            --text-color: #333333;
            --gray-bg: #f8f9fa;
        }
        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-color);
            background-color: var(--gray-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }
        .login-wrapper { width: 100%; max-width: 450px; padding: 20px; }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .brand-logo {
            font-weight: 900; font-size: 2.5rem; color: var(--dark-blue);
            text-align: center; text-decoration: none; display: block; margin-bottom: 5px;
        }
        .brand-logo span { color: var(--primary-blue); }
        .login-title {
            text-align: center; color: #666; font-weight: 600;
            font-size: 1.1rem; margin-bottom: 30px;
        }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%); color: #adb5bd; font-size: 1.1rem;
        }
        .form-control-lg {
            border-radius: 12px; font-size: 1rem;
            padding: 16px 20px 16px 50px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
        }
        .form-control-lg:focus {
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            border-color: var(--primary-blue);
            background-color: #ffffff;
        }
        .form-select-lg {
            border-radius: 12px; font-size: 1rem;
            padding: 16px 20px;
            background-color: var(--gray-bg);
            border: 1px solid #e9ecef;
        }
        .btn-primary-custom {
            background-color: var(--primary-blue); color: white;
            border-radius: 12px; padding: 15px; font-weight: 700;
            font-size: 1.1rem; width: 100%; border: none;
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.2);
        }
        .btn-primary-custom:hover {
            background-color: #004494; color: white; transform: translateY(-2px);
        }
        .link-custom {
            color: var(--primary-blue); text-decoration: none; font-weight: 600;
        }
        .link-custom:hover { color: #004494; text-decoration: underline; }
        .back-to-home {
            display: block; text-align: center; margin-top: 20px;
            color: #999; text-decoration: none; font-size: 0.9rem;
        }
        .back-to-home:hover { color: var(--text-color); }
        .agree-box {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 20px;
            background: #fafbfc;
            margin-bottom: 20px;
        }
        .agree-all-row {
            display: flex;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        .agree-all-row label {
            font-weight: 700;
            font-size: 0.97rem;
            cursor: pointer;
            margin-left: 8px;
        }
        .agree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .agree-item:last-child { margin-bottom: 0; }
        .agree-item label {
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            margin-left: 8px;
        }
        .agree-item .view-link {
            font-size: 0.82rem;
            color: var(--primary-blue);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .agree-item .view-link:hover { text-decoration: underline; }
        .form-check-input { cursor: pointer; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>WONE</span> Recruit</a>
        <div class="login-title">새 계정 만들기</div>

        {% if error == 'dup' %}
        <div class="alert alert-danger py-2 small mb-3">이미 사용 중인 아이디입니다. 다른 아이디를 사용해 주세요.</div>
        {% elif error == 'agree_required' %}
        <div class="alert alert-danger py-2 small mb-3">이용약관과 개인정보 수집 및 이용에 동의해 주세요.</div>
        {% endif %}

        <form action="/signup" method="post">
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="name" class="form-control form-control-lg" placeholder="이름" required>
                <i class="fas fa-id-card"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="phone" class="form-control form-control-lg" placeholder="전화번호">
                <i class="fas fa-phone"></i>
            </div>
            <div class="mb-4">
                <div class="d-flex gap-4 justify-content-center py-2">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role_seeker" value="seeker" checked>
                        <label class="form-check-label fw-600" for="role_seeker">구직자(장애인)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role_company" value="company">
                        <label class="form-check-label fw-600" for="role_company">기업</label>
                    </div>
                </div>
            </div>
            <div class="agree-box">
                <div class="agree-all-row">
                    <input class="form-check-input" type="checkbox" id="agree_all">
                    <label for="agree_all">전체 동의</label>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_terms" id="agree_terms" value="1">
                        <label for="agree_terms">[필수] 이용약관 동의</label>
                    </div>
                    <a href="/terms" target="_blank" class="view-link">보기</a>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_privacy" id="agree_privacy" value="1">
                        <label for="agree_privacy">[필수] 개인정보 수집 및 이용 동의</label>
                    </div>
                    <a href="/privacy" target="_blank" class="view-link">보기</a>
                </div>
                <div class="agree-item">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input" type="checkbox" name="agree_marketing" id="agree_marketing" value="1">
                        <label for="agree_marketing">[선택] 마케팅 정보 수신 동의</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-custom">가입하기</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted" style="font-size: 0.95rem;">이미 계정이 있으신가요?</span>
            <a href="/login" class="link-custom ms-1">로그인</a>
        </div>
    </div>
    <a href="/login" class="back-to-home"><i class="fas fa-arrow-left me-1"></i> 로그인으로 돌아가기</a>
</div>
<script>
    const agreeAll = document.getElementById('agree_all');
    const agreeTerms = document.getElementById('agree_terms');
    const agreePrivacy = document.getElementById('agree_privacy');
    const agreeMarketing = document.getElementById('agree_marketing');
    const required = [agreeTerms, agreePrivacy];
    const all = [agreeTerms, agreePrivacy, agreeMarketing];

    agreeAll.addEventListener('change', () => {
        all.forEach(c => c.checked = agreeAll.checked);
    });

    all.forEach(c => c.addEventListener('change', () => {
        agreeAll.checked = all.every(x => x.checked);
    }));

    document.querySelector('form').addEventListener('submit', e => {
        if (!agreeTerms.checked || !agreePrivacy.checked) {
            e.preventDefault();
            alert('이용약관과 개인정보 수집 및 이용에 동의해 주세요.');
        }
    });
</script>
</body>
</html>
