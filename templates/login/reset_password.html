<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - WONE Recruit</title>
    <script>
    (function(){var t=localStorage.getItem('recruit_theme');
    if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);})();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>WONE</span> Recruit</a>
        <div class="login-title">비밀번호 재설정</div>

        {% if valid %}
        {% include "common/pw_error.html" %}

        <form action="/reset-password" method="post">
            {{ csrf_input }}
            <input type="hidden" name="token" value="{{ token }}">
            <div class="mb-3 input-icon-wrapper">
                <input type="password" name="new_password" class="form-control form-control-lg"
                       placeholder="새 비밀번호" aria-label="새 비밀번호" aria-describedby="pwHint" autocomplete="new-password" minlength="12" data-pw-new required>
                <i class="fas fa-lock" aria-hidden="true"></i>
            </div>
            <div class="mb-1 input-icon-wrapper">
                <input type="password" name="confirm_password" class="form-control form-control-lg"
                       placeholder="새 비밀번호 확인" aria-label="새 비밀번호 확인" aria-describedby="pwMatch" autocomplete="new-password" minlength="12" data-pw-confirm required>
                <i class="fas fa-lock" aria-hidden="true"></i>
            </div>
            {% include "common/pw_help.html" %}
            <button type="submit" class="btn btn-primary-custom">비밀번호 변경</button>
        </form>
        {% else %}
        <div class="alert alert-warning small mb-3" role="alert">
            링크가 만료되었거나 이미 사용되었습니다. 비밀번호 찾기를 다시 진행해 주세요.
        </div>
        <a href="/forgot-password" class="btn btn-primary-custom">비밀번호 찾기</a>
        {% endif %}

        <div class="text-center mt-4">
            <a href="/login" class="link-custom">로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/pw-field.js"></script>
</body>
</html>
