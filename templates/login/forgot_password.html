<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - WONE Recruit</title>
    <script>
    (function(){var t=localStorage.getItem('recruit_theme');
    if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);})();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --text: #222;
            --text-muted: #999;
            --border: #e5e5e5;
            --bg: #f7f8fa;
        }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            color: var(--text);
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .login-card { background: #fff; border-radius: 8px; padding: 40px 36px; border: 1px solid var(--border); }
        .brand-logo { font-weight: 700; font-size: 2rem; color: var(--text); text-align: center; text-decoration: none; display: block; margin-bottom: 4px; }
        .brand-logo span { color: var(--primary); }
        .login-title { text-align: center; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; margin-bottom: 32px; }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 1rem; }
        .form-control-lg { border-radius: 4px; font-size: 0.95rem; padding: 12px 16px 12px 40px; background-color: var(--bg); border: 1px solid var(--border); }
        .form-control-lg:focus { box-shadow: none; border-color: var(--primary); background-color: #fff; }
        .btn-primary-custom { background-color: var(--primary); color: white; border-radius: 6px; padding: 12px; font-weight: 600; font-size: 1rem; width: 100%; border: none; }
        .btn-primary-custom:hover { background-color: var(--primary-hover); color: white; }
        .link-custom { color: var(--primary); text-decoration: none; font-weight: 600; }
        .link-custom:hover { color: var(--primary-hover); text-decoration: underline; }
        .temp-pw-box { background: #e8f4fd; border: 1px solid #b8daef; border-radius: 6px; padding: 20px; text-align: center; }
        .temp-pw-box code { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; color: var(--primary); }

        [data-theme="dark"] {
            --text: #D1D5DB; --text-muted: #6B7280; --border: #2D333B; --bg: #161B22;
            --primary: #4a9eff; --primary-hover: #3a8ae6;
            color-scheme: dark;
        }
        [data-theme="dark"] .login-card { background: #1C2128; }
        [data-theme="dark"] .form-control-lg { background-color: var(--bg); color: var(--text); }
        [data-theme="dark"] .form-control-lg:focus { background-color: #1C2128; }
        [data-theme="dark"] .input-icon-wrapper i { color: var(--text-muted); }
        [data-theme="dark"] .temp-pw-box { background: #1a2636; border-color: #2D4A6A; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <a href="/login" class="brand-logo"><span>WONE</span> Recruit</a>
        <div class="login-title">비밀번호 찾기</div>

        {% if temp_pw %}
        <div class="temp-pw-box mb-3">
            <p class="mb-2 fw-semibold">임시 비밀번호가 발급되었습니다</p>
            <code>{{ temp_pw }}</code>
            <p class="text-muted small mt-2 mb-0">로그인 후 반드시 비밀번호를 변경해주세요</p>
        </div>
        <a href="/login" class="btn btn-primary-custom">로그인하기</a>
        {% else %}

        {% if error == 'not_found' %}
        <div class="alert alert-danger py-2 small mb-3">일치하는 계정을 찾을 수 없습니다.</div>
        {% elif error == 'deleted' %}
        <div class="alert alert-warning py-2 small mb-3">탈퇴한 계정입니다.</div>
        {% endif %}

        <form action="/forgot-password" method="post">
            {{ csrf_input }}
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="아이디" required>
                <i class="far fa-user"></i>
            </div>
            <div class="mb-3 input-icon-wrapper">
                <input type="text" name="name" class="form-control form-control-lg" placeholder="이름" required>
                <i class="far fa-id-card"></i>
            </div>
            <div class="mb-4 input-icon-wrapper">
                <input type="tel" name="phone" class="form-control form-control-lg" placeholder="휴대폰 번호" required>
                <i class="fas fa-phone"></i>
            </div>
            <button type="submit" class="btn btn-primary-custom">비밀번호 찾기</button>
        </form>
        {% endif %}

        <div class="text-center mt-4">
            <a href="/login" class="link-custom">로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
