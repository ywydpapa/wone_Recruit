<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - WONE Recruit</title>
    <script>
    (function(){var t=localStorage.getItem('recruit_theme');
    if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);})();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-logo"><span>WONE</span> Recruit</div>
        <div class="login-title">새 비밀번호를 설정해 주세요</div>

        <div class="alert alert-info py-2 small mb-3">
            임시 비밀번호로 로그인하셨습니다. 보안을 위해 새 비밀번호를 설정해 주세요.
        </div>

        {% if error == 'mismatch' %}
        <div class="alert alert-danger py-2 small mb-3">비밀번호가 일치하지 않습니다.</div>
        {% elif error == 'short' %}
        <div class="alert alert-danger py-2 small mb-3">비밀번호는 8자 이상이어야 합니다.</div>
        {% endif %}

        <form action="/change-password" method="post">
            {{ csrf_input }}
            <div class="mb-3 input-icon-wrapper">
                <input type="password" name="new_password" class="form-control form-control-lg"
                       placeholder="새 비밀번호 (8자 이상)" minlength="8" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="mb-4 input-icon-wrapper">
                <input type="password" name="confirm_password" class="form-control form-control-lg"
                       placeholder="새 비밀번호 확인" minlength="8" required>
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="btn btn-primary-custom">비밀번호 변경</button>
        </form>

        <div class="text-center mt-3">
            <a href="/logout" class="text-muted small">로그아웃</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
