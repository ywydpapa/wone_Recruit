{% extends "base.html" %}
{% block title %}새 글 작성 - WONE Recruit{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0">새 글 작성</h2><a href="/community" class="btn btn-light rounded-pill px-4 shadow-sm"><i class="fas fa-arrow-left me-2"></i>돌아가기</a></div>
<div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="content-card">
                    <div class="card-title mb-4 border-bottom pb-3">
                        <span><i class="fas fa-pencil-alt me-2 text-primary"></i>글 작성</span>
                    </div>
                    <form action="/api/posts" method="POST">
                        <div class="mb-3">
                            <label for="postCategory" class="form-label fw-bold">카테고리 <span class="text-danger">*</span></label>
                            <select class="form-select" id="postCategory" name="category" required>
                                <option value="" disabled selected>카테고리를 선택하세요</option>
                                {% for key, (label, _) in categories.items() %}
                                <option value="{{ key }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="postTitle" class="form-label fw-bold">제목 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="postTitle" name="title" placeholder="글 제목을 입력하세요" required>
                        </div>
                        <div class="mb-4">
                            <label for="postContent" class="form-label fw-bold">내용 <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="postContent" name="content" rows="12" placeholder="글 내용을 입력하세요" required></textarea>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/community" class="btn btn-light px-4"><i class="fas fa-times me-2"></i>취소</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-paper-plane me-2"></i>게시하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
