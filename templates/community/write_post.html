{% extends "base.html" %}
{% block title %}새 글 작성 - WONE Recruit{% endblock %}
{% block content %}
<div class="page-header"><h2>새 글 작성</h2></div>

<form action="/api/posts" method="POST" class="content-card">
    {{ csrf_input }}
    <div class="mb-3">
        <label for="postCategory" class="form-label fw-bold">카테고리 <span class="text-danger">*</span></label>
        <select class="form-select" id="postCategory" name="category" required>
            <option value="" disabled selected>카테고리를 선택하세요</option>
            {% for key, (label, _) in categories.items() %}
            <option value="{{ key }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="postTitle" class="form-label fw-bold">제목 <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="postTitle" name="title" placeholder="글 제목을 입력하세요" required>
    </div>
    <div class="mb-4">
        <label for="postContent" class="form-label fw-bold">내용 <span class="text-danger">*</span></label>
        <textarea class="form-control" id="postContent" name="content" rows="12" placeholder="글 내용을 입력하세요" required></textarea>
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a href="/community" class="btn btn-outline-secondary px-4">취소</a>
        <button type="submit" class="btn btn-primary px-4">게시하기</button>
    </div>
</form>
{% endblock %}
