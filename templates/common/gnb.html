<header class="gnb">
    <div class="gnb-inner">
        <a href="/" class="gnb-logo">WONE</a>
        <nav class="gnb-menu" aria-label="주 메뉴">
            {% for href, label in gnb_menu %}
            <a href="{{ href }}"{% if request.url.path.startswith(href) %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
            {% endfor %}
        </nav>
        <div class="gnb-util">
            <button type="button" class="gnb-icon" id="themeToggle" aria-label="다크모드 전환"><i class="fas fa-moon" aria-hidden="true"></i></button>
            <a href="/notifications" class="gnb-icon" id="topbar-notif-btn" aria-label="알림">
                <i class="fas fa-bell" aria-hidden="true"></i>
                <span id="topbar-notif-badge" class="topbar-badge d-none" aria-live="polite">0</span>
            </a>
            <a href="/messages" class="gnb-icon" id="topbar-msg-btn" aria-label="메시지">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span id="topbar-msg-badge" class="topbar-badge d-none">0</span>
            </a>
            {% if request.session.get('logined') %}
            <a href="/status" class="gnb-mypage{% if request.url.path|mypage %} active{% endif %}">마이페이지</a>
            <a href="/logout" class="gnb-logout">로그아웃</a>
            {% else %}
            <a href="/login" class="gnb-mypage">로그인</a>
            {% endif %}
        </div>
    </div>
</header>
