<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('WONE Recruit') }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/style.css">

    <script>
    (function(){
        var font = localStorage.getItem('a11y_font') || 'normal';
        var contrast = localStorage.getItem('a11y_contrast') === '1';
        var el = document.documentElement;
        if (font === 'large') el.classList.add('a11y-large');
        else if (font === 'xlarge') el.classList.add('a11y-xlarge');
        if (contrast) el.classList.add('a11y-contrast');
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function loadSidoList(selectId, selectedSido) {
        var sel = document.getElementById(selectId);
        if (!sel) return;
        var res = await fetch('/api/regions');
        var data = await res.json();
        sel.innerHTML = '<option value="">-- 선택 --</option>' +
            data.map(function(s){ return '<option value="'+s+'"'+(s===selectedSido?' selected':'')+'>'+s+'</option>'; }).join('');
    }
    async function loadSigungu(sido, selectId, selectedId) {
        var sel = document.getElementById(selectId);
        if (!sel) return;
        sel.innerHTML = '<option value="">로딩 중...</option>';
        if (!sido) { sel.innerHTML = '<option value="">-- 시/도를 먼저 선택 --</option>'; return; }
        var res = await fetch('/api/regions?sido=' + encodeURIComponent(sido));
        var data = await res.json();
        sel.innerHTML = '<option value="">-- 선택 --</option>' +
            data.map(function(r){ return '<option value="'+r.id+'"'+(r.id==selectedId?' selected':'')+'>'+r.sigungu+'</option>'; }).join('');
    }
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/notifications/count')
            .then(function(r){ return r.json(); })
            .then(function(data) {
                var badge = document.getElementById('notif-badge');
                if (badge && data.count > 0) {
                    badge.textContent = data.count > 99 ? '99+' : data.count;
                    badge.classList.remove('d-none');
                }
            })
            .catch(function(){});
    });
    </script>
</head>
