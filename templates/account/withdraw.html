{% extends "base.html" %}
{% block title %}회원탈퇴 - WONE Recruit{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="fas fa-user-times me-2"></i>회원탈퇴</h2></div>
<div class="container">
        <div class="content-card narrow-form-sm">
            <div class="alert alert-warning mb-4" role="alert">
                <p class="mb-1"><i class="fas fa-exclamation-triangle me-1"></i> <strong>탈퇴하면 다음과 같이 처리됩니다.</strong></p>
                <ul class="mb-0 mt-2 ps-3 fs-095">
                    <li>지원서와 활동 기록은 일정 기간 보관 후 삭제됩니다.</li>
                    <li>탈퇴 후 같은 아이디로 재가입할 수 없습니다.</li>
                    <li>이 작업은 되돌릴 수 없습니다.</li>
                </ul>
            </div>
            {% if error == 'wrong' %}
            <div class="alert alert-danger" role="alert">비밀번호가 일치하지 않습니다.</div>
            {% endif %}
            <form method="post" action="/account/withdraw">
                <div class="mb-3">
                    <label for="reason" class="form-label">탈퇴 사유 <span class="text-muted small">(선택)</span></label>
                    <select id="reason" name="reason" class="form-select">
                        <option value="">선택 안 함</option>
                        <option value="inactive">사용하지 않아서</option>
                        <option value="other_service">다른 서비스를 이용하고 있어서</option>
                        <option value="privacy">개인정보가 걱정돼서</option>
                        <option value="etc">기타</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="current_password" class="form-label">현재 비밀번호 확인</label>
                    <input type="password" id="current_password" name="current_password" class="form-control" placeholder="비밀번호를 입력해 주세요" required>
                </div>
                <div class="d-flex gap-2">
                    <a href="/" class="btn btn-outline-secondary w-50">취소</a>
                    <button type="submit" class="btn btn-danger w-50">탈퇴하기</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
