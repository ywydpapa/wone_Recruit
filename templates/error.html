{% extends "base.html" %}
{% block title %}{{ status_code }} | WONE Recruit{% endblock %}
{% block content %}
<div class="page-header">
    <h2>{{ status_code }}</h2>
</div>
<div class="content-card text-center py-5">
    <i class="fas fa-exclamation-circle fa-3x text-muted mb-3" aria-hidden="true"></i>
    <h4 class="fw-bold mb-2">{{ message }}</h4>
    <p class="text-muted mb-4">{{ detail }}</p>
    <a href="/" class="btn btn-primary px-4">홈으로</a>
</div>
{% endblock %}
